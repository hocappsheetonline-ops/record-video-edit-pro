appId: app.lumora.desktop
productName: Lumora
executableName: Lumora
copyright: Copyright © 2026 Lumora
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - resources/**
  - package.json
  - '!**/*.{map,md,ts,tsx}'
  # MediaPipe: giao diện đã gói phần JS; main chỉ phục vụ bản wasm SIMD (Chromium luôn hỗ trợ).
  - '!node_modules/@mediapipe/tasks-vision/vision_bundle.*'
  - '!node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.*'
  - '!node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_module_internal.*'
# File thực thi và thư viện native không chạy được từ bên trong gói asar.
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Lumora-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Lumora
npmRebuild: false
# Tự cập nhật: app đọc bản mới từ GitHub Releases của repo (công khai, không cần token).
publish:
  provider: github
  owner: hocappsheetonline-ops
  repo: record-video-edit-pro
  releaseType: release
