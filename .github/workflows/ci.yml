name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test & build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cài thư viện
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Kiểm tra kiểu (typecheck)
        run: pnpm typecheck

      - name: Unit test & test giao diện
        run: pnpm test

      - name: Cài Chromium cho test khách mời livestream
        run: pnpm --filter @lumora/desktop exec playwright install chromium

      - name: Test E2E (mở app Electron thật)
        run: pnpm test:e2e

      - name: Đóng gói bộ cài Windows (.exe)
        run: pnpm package:win

      - name: Tải lên bộ cài
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-Setup-windows
          path: apps/desktop/release/*/Lumora-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Tải lên báo cáo E2E khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7
