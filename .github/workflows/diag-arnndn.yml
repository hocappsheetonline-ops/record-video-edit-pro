name: Diag arnndn
on:
  push:
    paths: ['.github/workflows/diag-arnndn.yml', 'apps/desktop/resources/rnnoise/**']
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure
        shell: bash
        run: |
          curl -sSL -o ff.gz https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz
          gunzip ff.gz && mv ff ff.exe
          git show HEAD~1:apps/desktop/resources/rnnoise/sh.rnnn > orig.rnnn
          ./ff.exe -hide_banner -loglevel error -y -f lavfi -i "anoisesrc=d=3:c=white:a=0.08:r=48000" n.wav
          for name in orig apps/desktop/resources/rnnoise/sh; do
            M="$(cygpath -m "$PWD/$name.rnnn")"; M="${M//:/\\:}"
            for i in $(seq 1 12); do
              ./ff.exe -hide_banner -i n.wav -af "arnndn=m='$M',volumedetect" -f null - 2>&1 | grep -oE "mean_volume: [-0-9.]+" | tr -d '\r' | sed "s|^|$name |"
            done
          done
